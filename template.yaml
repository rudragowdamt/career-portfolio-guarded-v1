AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Public career portfolio RAG API - demo deployment
Parameters:
  AllowedOrigin:
    Type: String
    Default: https://career-portfolio-starter.vercel.app
  VisitorHashSalt:
    Type: String
    NoEcho: true
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
Globals:
  Function:
    Timeout: 28
    MemorySize: 1024
    Runtime: python3.12
    Architectures: [x86_64]
Resources:
  CareerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration: REGIONAL
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 3
  QuotaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true
  CareerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda_handler.handler
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          AI_MODE: bedrock
          AI_ENABLED: 'true'
          QUOTA_TABLE: !Ref QuotaTable
          VISITOR_HASH_SALT: !Ref VisitorHashSalt
          PER_VISITOR_DAILY: '10'
          GLOBAL_DAILY: '10'
          GLOBAL_MONTHLY: '100' 
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ALLOWED_ORIGINS: !Ref AllowedOrigin
          MAX_REQUESTS_PER_MINUTE: '8'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:ap-south-1::foundation-model/amazon.nova-lite-v1:0
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-lite-v1:0'
                - arn:aws:bedrock:ap-southeast-1::foundation-model/amazon.nova-lite-v1:0
                - arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-lite-v1:0
                - arn:aws:bedrock:ap-northeast-1::foundation-model/amazon.nova-lite-v1:0
                - arn:aws:bedrock:ap-northeast-2::foundation-model/amazon.nova-lite-v1:0
                - arn:aws:bedrock:ap-northeast-3::foundation-model/amazon.nova-lite-v1:0
        - DynamoDBCrudPolicy:
            TableName: !Ref QuotaTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !GetAtt QuotaTable.Arn
      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref CareerApi
            Path: /{proxy+}
            Method: ANY
Outputs:
  ApiBaseUrl:
    Description: Base URL for career API (copy into config.js)
    Value: !Sub 'https://${CareerApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'




